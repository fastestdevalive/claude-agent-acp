[package]
name = "claude-agent-acp-rs"
version = "0.1.0"
publish = false
edition = "2021"
description = "Native Rust driver for the Claude ACP agent protocol, pinned by porting/UPSTREAM_VERSION"

[dependencies]
agent-client-protocol = { version = "2.1", features = ["unstable_tool_call_name"] }
# The crate's `Lines` transport is generic over `futures` sinks/streams; the
# stdio wire wrapper (ROADMAP F2c) builds them directly.
futures = "0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "user"] }

[dev-dependencies]
# `test-util` enables `#[tokio::test(start_paused = true)]` / `tokio::time::advance`
# used by the paused-time tests (inv_17/inv_22). Test-only, never affects the
# library build.
tokio = { version = "1", features = ["test-util"] }
