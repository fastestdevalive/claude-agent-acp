[package]
name = "claude-agent-acp-rs"
version = "0.1.0+acp.0.70.0"
edition = "2021"
description = "Native Rust driver for the Claude ACP agent protocol, at parity with @agentclientprotocol/claude-agent-acp v0.70.0"

[dependencies]
agent-client-protocol = "2.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }
