[package]
name = "acp-recorder"
version = "0.1.0"
edition = "2021"
description = "Records the ordered ACP frames exchanged with an ACP agent over stdio"

[dependencies]
claude-agent-acp-rs = { path = "../claude-agent-acp-rs" }
agent-client-protocol = "2.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
